<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" role="img" aria-label="Roadmap: tools, code, team, start, first project, ship">
<style>.t{font:800 15px Archivo,Helvetica,Arial,sans-serif;fill:#f3f2f2}.s{font:12px Archivo,Helvetica,Arial,sans-serif;fill:#9b9797}.b{fill:#141312;stroke:#f3f2f2;stroke-opacity:.45;stroke-width:2}
.on{fill:#ec3013;opacity:0;animation:on 9s steps(1) infinite}.l{stroke:#ec3013;stroke-width:3;stroke-dasharray:130;stroke-dashoffset:130;animation:ln 9s linear infinite}
.n1{animation-delay:0s}.n2{animation-delay:1.2s}.n3{animation-delay:2.4s}.n4{animation-delay:3.6s}.n5{animation-delay:4.8s}.n6{animation-delay:6s}
@keyframes on{0%{opacity:1}85%{opacity:1}86%,100%{opacity:0}}@keyframes ln{0%{stroke-dashoffset:130}13%,80%{stroke-dashoffset:0}81%,100%{stroke-dashoffset:130;opacity:0}}
@media (prefers-reduced-motion:reduce){.on{animation:none;opacity:1}.l{animation:none;stroke-dashoffset:0}}
</style><rect width="960" height="150" fill="#141312"/>
